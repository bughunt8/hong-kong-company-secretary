version: "3.9"

services:

  # -----------------------------------------------------------------------
  # Ollama – local LLM inference server
  # Supports any model including llama3, mistral, gemma, and custom models
  # like Nemoclaw or Openclaw (loaded via Modelfile).
  # -----------------------------------------------------------------------
  ollama:
    image: ollama/ollama:latest
    container_name: hkcs_ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    # Uncomment the following lines if you have an NVIDIA GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: all
    #           capabilities: [gpu]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------------------
  # Model initialiser – pulls the default model on first start
  # -----------------------------------------------------------------------
  ollama-init:
    image: ollama/ollama:latest
    container_name: hkcs_ollama_init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_data:/root/.ollama
    environment:
      - OLLAMA_HOST=http://ollama:11434
    entrypoint: >
      sh -c "
        ollama pull ${LLM_MODEL:-llama3} &&
        echo 'Model pull complete.'
      "
    restart: "no"

  # -----------------------------------------------------------------------
  # HK Company Secretary bot – FastAPI application
  # -----------------------------------------------------------------------
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: hkcs_app
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - WIKI_DIR=/app/wiki
      - OLLAMA_URL=http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5

  # -----------------------------------------------------------------------
  # Nginx reverse proxy (optional – useful for SSL termination in production)
  # Comment out or remove this service if not needed.
  # -----------------------------------------------------------------------
  nginx:
    image: nginx:alpine
    container_name: hkcs_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - app
    profiles:
      - production

volumes:
  ollama_data:
